services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to a 12+ character value}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the browser-accessible URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: sqlite+aiosqlite:////app/data/labboard.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
