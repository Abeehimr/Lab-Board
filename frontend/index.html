<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabBoard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="top-actions">
      <span id="connection-status" class="status">Connecting…</span>
      <button id="notifications-open" class="button secondary">Enable notifications</button>
      <button id="logout" class="button secondary hidden">Log out</button>
    </div>
  </header>
  <main class="layout">
    <section class="intro">
      <p class="eyebrow">Announcements</p>
      <h1 id="page-title">Announcements</h1>
    </section>
    <section id="composer" class="card hidden">
      <h2>Publish an announcement</h2>
      <form id="publish-form">
        <label for="body">Message</label>
        <textarea id="body" name="body" rows="5" maxlength="20000" required></textarea>
        <label for="files">Attachments</label>
        <input id="files" name="files" type="file" multiple>
        <div class="form-row">
          <button class="button primary" type="submit">Publish</button>
          <span id="publish-error" class="error"></span>
        </div>
      </form>
    </section>
    <section id="feed" class="feed" aria-live="polite"></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
